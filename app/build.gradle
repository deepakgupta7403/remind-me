plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.ksp)
}

// Release signing: secrets live in keystore.properties (gitignored, never committed).
// If the file is absent (e.g. CI or a fresh clone) the release build stays unsigned
// rather than failing — only a local machine with the keystore can sign a release.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'in.deepak.remindme'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "in.deepak.remindme"
        minSdk 33
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                // Resolve relative to the project root, not the app/ module, so the
                // keystore can live at the repo root (matches the keytool command).
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

// AGP 9.x: configure Kotlin compilation via the top-level `kotlin` extension
// (the old `android.kotlinOptions` block was removed in AGP 9).
kotlin {
    jvmToolchain(17)
}

// Export Room's generated schema JSON (app/schemas) so future DB version bumps
// + migrations are reviewable in git. When migration tests are added, wire this
// dir in as an androidTest asset so MigrationTestHelper can read old schemas.
ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

dependencies {
    // --- Core Android / Lifecycle ---
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.lifecycle.viewmodel.compose

    // --- Compose (BOM controls versions) ---
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.material.icons.extended

    // --- Navigation ---
    implementation libs.androidx.navigation.compose

    // --- Coroutines ---
    implementation libs.kotlinx.coroutines.android

    // --- Persistence ---
    // Room is the system of record (reminders, stats, templates).
    implementation libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    ksp libs.androidx.room.compiler
    // Gson: legacy-import reader only (old reminders.json + stats prefs).
    implementation libs.gson

    // --- Unit tests ---
    testImplementation libs.junit

    // --- Instrumented + Compose UI tests ---
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4

    // --- Debug-only tooling ---
    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest
}
